services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cvforge-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - MONGODB_URI=${MONGODB_URI:-mongodb://ghandi:password@mongodb:27017/cvforge?authSource=admin}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-cvforge}
      - AUTH_SECRET=${AUTH_SECRET:-cvforge-production-super-secret-key-min-32-chars-long-12345}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:3001}
    env_file:
      - path: .env
        required: false
    networks:
      - mongodb_default

networks:
  mongodb_default:
    external: true
